plugins { id 'com.android.application' }

android {
    namespace 'com.siyam.landshare'
    compileSdk 36

    defaultConfig {
        applicationId 'com.siyam.landshare'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
